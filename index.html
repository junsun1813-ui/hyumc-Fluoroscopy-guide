<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>투시검사 안내</title>
<style>
:root{--bg1:#eaf3fb;--bg2:#f8fbfe;--ink:#14263d;--sub:#5b6b80;--pri:#1b5fa8;--pri2:#e3eefa;--card:#fff;--line:#d6e3f1;--warn:#fff4e5;--warnl:#f0c27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0f1c2c;--bg2:#13243a;--ink:#e6eef8;--sub:#9fb2c8;--pri:#7db4ee;--pri2:#1c3552;--card:#182c45;--line:#2a4666;--warn:#3a2f1c;--warnl:#8a6a2b}}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;line-height:1.7;font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg1) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header b{font-size:15px}header small{color:var(--sub);font-size:12px;display:block;line-height:1.2}
#back{display:none;border:0;background:var(--pri2);color:var(--pri);font:inherit;font-weight:700;border-radius:20px;padding:6px 14px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:26px;line-height:1.35;margin:8px 0 4px}.lead{color:var(--sub);margin:0 0 20px}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;box-shadow:0 2px 10px rgba(27,95,168,.07);transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--pri);outline:none}
.card .ic{font-size:26px}.card h3{margin:6px 0 2px;font-size:17px;line-height:1.35}.card p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.5}
.wide{display:flex;gap:16px;align-items:center;padding:22px;margin-bottom:14px;background:var(--pri);border-color:var(--pri);color:#fff}
.wide p{color:#dbe9fa;font-size:14px}.wide .ic{font-size:38px}.wide h3{font-size:21px;color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .wide{color:#0b1b2e}:root:not([data-theme=light]) .wide h3{color:#0b1b2e}:root:not([data-theme=light]) .wide p{color:#17324f}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 12px}
.sec h2{font-size:16.5px;margin:0 0 8px;color:var(--pri)}.sec p{margin:0 0 8px}.sec p:last-child{margin:0}
.sec ul,.sec ol{margin:0;padding-left:20px}.sec li{margin:3px 0}
.sec.warn{background:var(--warn);border-color:var(--warnl)}.sec.warn h2{color:inherit}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border:0}
summary{cursor:pointer;font-weight:700;list-style:none}summary::before{content:"Q. ";color:var(--pri)}
details p{margin:8px 0 0;color:var(--sub)}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}.brand img{height:36px;width:auto;display:block;mix-blend-mode:multiply}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{mix-blend-mode:normal;background:#fff;border-radius:6px;padding:2px 6px}}.brand span{font-weight:700;font-size:13px;color:var(--pri);margin-top:3px}
.card.bg{position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;border:0;background-size:cover;background-position:center}
.card.bg::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,36,.35),rgba(8,20,36,.85))}
.card.bg>*{position:relative}.card.bg h3{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}.card.bg p{color:#dce8f5}
.card.bg.wide{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;min-height:130px}.card.bg.wide::before{background:linear-gradient(90deg,rgba(14,52,98,.88),rgba(14,52,98,.45))}
.hero{position:relative}
.hero .wide{margin-bottom:12px}
.hero .card.glass{position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:0;border-radius:22px;background-repeat:no-repeat;box-shadow:none;padding:22px 14px}
.hero .card.glass::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.76)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero .card.glass::before{background:rgba(15,28,44,.74)}}
.hero .card.glass>*{position:relative}.hero .card.glass .ic{display:none}
.hero .card.glass,.hero .card.glass h3{color:var(--ink)!important}.hero .card.glass p{color:var(--sub)!important}
.hero .card.glass h3{font-size:19px}.hero .wide.glass{min-height:190px}.hero .wide.glass h3{font-size:25px}
.card.bg{align-items:center;justify-content:center;text-align:center}
body.home h1,body.home .lead{text-align:center}body.home h1{font-size:30px}
.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 18px}
.pill{display:inline-block;text-decoration:none;font-weight:700;font-size:14.5px;color:var(--pri);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;box-shadow:0 2px 8px rgba(27,95,168,.08)}
.pill:hover,.pill:focus-visible{border-color:var(--pri);outline:none}
.fig{margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fig img{display:block;width:100%;height:auto}.fig figcaption{padding:12px 16px;font-weight:700;font-size:16px}
.sp{flex:1}#logo{height:34px;width:auto;display:block;mix-blend-mode:multiply}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #logo{mix-blend-mode:normal;background:#fff;border-radius:6px;padding:2px 6px}}
#cb{border:0;background:var(--pri2);color:var(--pri);font:inherit;font-size:13px;font-weight:700;border-radius:20px;padding:6px 14px;cursor:pointer}
#lang{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--ink);border-radius:20px;padding:5px 8px;background:var(--card);color:var(--ink)}
.note{background:var(--pri2);color:var(--pri);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:40px;align-items:start;overflow-wrap:anywhere}@media(max-width:640px){.ct{grid-template-columns:minmax(0,1fr)}}
.ct h2{font-size:24px;margin:0 0 6px;color:var(--ink)}.lead2{color:var(--sub);margin:0 0 14px}.ct dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:16px}.ct dl>div{display:contents}
.ct dt,.ct dd{padding:12px 0;border-top:1px solid var(--line);color:var(--ink)}.ct dt{font-weight:700;overflow-wrap:normal}.ct dd{margin:0;min-width:0}
@media(max-width:420px){#logo{height:28px}#back,#cb{padding:5px 10px}header{gap:8px}}.ct a{color:var(--pri);font-weight:600;text-decoration:none}.ctimg img{width:100%;border-radius:20px;display:block}
.foot{margin-top:24px;color:var(--sub);font-size:12.5px;text-align:center}
</style></head><body>
<header><button id="back" aria-label="back"></button><img id="logo" alt="한양대학교병원"><span class="sp"></span><button id="cb"></button><select id="lang" aria-label="Language"></select></header>
<main id="app"></main>

S("치료란?","p","투시 영상으로 척추 후관절의 위치를 확인한 뒤 스테로이드제와 국소마취제 등을 주입해 통증과 염증을 줄이는 치료입니다."),
S("검사 전 준비","ul",["의료진의 안내를 확인해주세요.","항응고제·항혈소판제 등 복용 중인 약을 알려주세요.","스테로이드, 국소마취제에 이상반응이 있었다면 알려주세요.","임신 가능성이 있다면 검사 전에 알려주세요."]),

const EXTR={"en":[[{"h":"What is this exam?","t":"p","c":"The Upper GI Series (UGI) uses contrast medium to examine the shape and movement of the lower esophagus, stomach, and duodenum. A Small Bowel Series observes how contrast moves through the small bowel to assess its structure and passage."},{"h":"Before the exam","t":"ul","c":["Fasting is required before the exam.","Please avoid smoking and chewing gum, as they may affect the exam.","Take your medications according to the hospital’s instructions."]},{"h":"How the exam is performed","t":"ol","c":["You will lie on the examination table and follow instructions for positioning.","You will drink contrast medium and, when needed, an effervescent agent that produces gas.","Fluoroscopy is used to watch the contrast pass in real time while you change positions; abdominal compression may be used when needed.","For a Small Bowel Series, images may be taken at intervals until the contrast has passed through the small bowel, so the exam may take longer."]},{"h":"During the exam","t":"p","c":"Please follow the instructions such as “hold your burp” or “turn onto your side.” Temporary abdominal bloating may occur.","w":1}],[{"h":"What is this exam?","t":"p","c":"You will swallow contrast medium while the shape of the esophagus and the passage of food are observed. The exam can be used to evaluate narrowing, difficulty in passage, or structural abnormalities of the esophagus."},{"h":"Before the exam","t":"p","c":"Fasting may be required depending on the exam. Follow the hospital’s instructions about food and drink before the exam."},{"h":"How the exam is performed","t":"ol","c":["You will take a position on the examination table as instructed.","You will swallow contrast medium when instructed.","The passage of the contrast through the esophagus is observed in real time.","Images may be taken in several positions when needed.","You may be asked to hold your breath or change position."]},{"h":"During the exam","t":"p","c":"Swallow the contrast when the medical staff instructs you. Some images are taken to check whether the contrast enters the airway, so please do not move on your own.","w":1}],[{"h":"What is this exam?","t":"p","c":"Contrast medium is used to examine the shape and condition of the rectum and colon. The exam can be used to evaluate narrowing, obstruction, and structural abnormalities of the colon."},{"h":"Before the exam","t":"p","c":"Residual stool can make the exam difficult, so bowel preparation is important. Follow the hospital’s instructions for dietary restrictions, fasting, and laxatives."},{"h":"How the exam is performed","t":"ol","c":["You will lie on your side on the examination table.","A catheter is inserted into the rectum, and contrast medium (and air, when used) is introduced.","Fluoroscopy is used to observe the colon as it fills with contrast, with images taken in different positions.","The exam may take longer depending on how the contrast passes through the colon."]},{"h":"During the exam","t":"p","c":"You may feel an urge to have a bowel movement or experience abdominal bloating as the contrast is introduced. Tell the medical staff if the discomfort becomes severe.","w":1}],[{"h":"What is a urethrogram (RUG)?","t":"p","c":"Contrast medium is used to examine the shape and passage of the urethra. It may be used to evaluate urethral narrowing or injury."},{"h":"How a urethrogram is performed","t":"ol","c":["You will lie on the examination table.","The examination area is disinfected, and a catheter may be inserted into the urethra when needed.","Contrast medium is injected through the catheter while the urethra is observed with fluoroscopy in different positions."]},{"h":"","t":"p","c":"You may experience mild discomfort or an urge to urinate during the exam."},{"h":"What is a cystogram?","t":"p","c":"Contrast medium is introduced into the bladder to examine its shape and check for abnormalities."},{"h":"How a cystogram is performed","t":"ol","c":["A catheter is inserted into the bladder.","Contrast medium is introduced through the catheter while the bladder fills.","Images are taken in the positions needed for the exam.","After the required images are taken, the contrast is drained and additional images may be obtained before the catheter is removed."]}],[{"h":"What is a VCUG?","t":"p","c":"Pediatric VCUG examines the bladder and urethra and checks whether urine flows backward from the bladder toward the ureters during urination. It is commonly used to evaluate vesicoureteral reflux (VUR), especially in children."},{"h":"Before the exam","t":"p","c":"Fasting is usually not required, but this can vary depending on the purpose of the exam and the patient’s condition. Follow the hospital’s instructions."},{"h":"How the exam is performed","t":"ol","c":["You will lie on the examination table.","After disinfection, a catheter is inserted through the urethra into the bladder, and contrast medium is introduced.","Fluoroscopy is used to observe and record the bladder as it fills and while you bear down or urinate, to check for reflux.","After imaging, you will urinate in the restroom in the fluoroscopy area. Additional post-voiding images may be taken to check the remaining urine and the condition of the bladder and ureters."]},{"h":"For children","t":"p","c":"Catheter insertion may be uncomfortable or stressful. A guardian can help the child cooperate by following the medical staff’s instructions.","w":1}],[{"h":"What is this exam?","t":"p","c":"This exam uses fluoroscopy to check the position of the knee replacement and its condition while the knee is moved, using images taken in different positions."},{"h":"Before the exam","t":"ul","c":["You may be asked to remove metal objects or accessories around the examination area.","You may be asked to change into examination clothing."]},{"h":"How the exam is performed","t":"ol","c":["You will take a position on the examination table as instructed.","You may be asked to change positions, such as bending the knee or lying prone, according to the medical staff’s instructions."]}],[{"h":"What is this exam?","t":"p","c":"A videofluoroscopic swallowing study (VFSS) observes the swallowing process with X-ray fluoroscopy to assess swallowing function and whether aspiration occurs. It evaluates the passage of food from the mouth to the pharynx and esophagus."},{"h":"Before the exam","t":"p","c":"Fasting may not be required in some cases, but this depends on the purpose of the exam and the patient’s condition. Follow the hospital’s instructions about eating before the exam."},{"h":"How the exam is performed","t":"ol","c":["You will take a position in front of the examination equipment.","While you swallow the food and drinks provided, fluoroscopy records the passage from the mouth to the pharynx and esophagus in real time.","Your position or swallowing method may be changed when needed for evaluation."]},{"h":"During the exam","t":"p","c":"Please swallow according to the medical staff’s instructions. The exam can assess whether aspiration, or entry of food or liquid into the airway, occurs.","w":1}],[{"h":"What is this treatment?","t":"p","c":"Using fluoroscopy, the location of the spinal facet joint is identified, and medications such as a steroid and local anesthetic are injected to reduce pain and inflammation."},{"h":"Before the treatment","t":"ul","c":["Follow the instructions provided by the medical staff.","Tell the medical staff about any medications you take, including anticoagulants and antiplatelet drugs.","Tell the medical staff if you have had a reaction to steroids or local anesthetics.","Tell the medical staff before the procedure if you may be pregnant."]},{"h":"How the treatment is performed","t":"ol","c":["You will lie prone or take the instructed position, and the skin will be disinfected.","Fluoroscopy is used to identify the target area; a small amount of contrast may be used when needed to confirm needle position.","The medication is injected and the needle is removed."]},{"h":"After the treatment","t":"p","c":"Temporary pain or soreness at the injection site may occur. Follow the medical staff’s instructions about activity and discharge."}]],"ru":[[{"h":"Что это за исследование?","t":"p","c":"Исследование верхних отделов ЖКТ (UGI) с контрастным веществом позволяет оценить форму и движение нижнего отдела пищевода, желудка и двенадцатиперстной кишки. При исследовании тонкой кишки наблюдают прохождение контрастного вещества по тонкой кишке и оценивают её строение и проходимость."},{"h":"Подготовка","t":"ul","c":["Перед исследованием требуется голодание.","Не курите и не жуйте жевательную резинку, поскольку это может повлиять на исследование.","Принимайте лекарства в соответствии с указаниями больницы."]},{"h":"Как проводится исследование","t":"ol","c":["Вы ложитесь на стол и принимаете положение по указанию персонала.","Вы выпиваете контрастное вещество и, при необходимости, шипучее средство, образующее газ.","С помощью рентгеноскопии наблюдают прохождение контраста в реальном времени; при необходимости вас просят менять положение и выполняют компрессию живота.","При исследовании тонкой кишки снимки могут выполняться через определённые интервалы до прохождения контраста по всей тонкой кишке, поэтому исследование может занять больше времени."]},{"h":"Во время исследования","t":"p","c":"Следуйте инструкциям, например «не отрыгивайте» или «повернитесь на бок». Временно может появиться вздутие живота.","w":1}],[{"h":"Что это за исследование?","t":"p","c":"Вы проглатываете контрастное вещество, одновременно наблюдается форма пищевода и прохождение пищи. Исследование позволяет оценить сужение пищевода, нарушение прохождения и структурные изменения."},{"h":"Подготовка","t":"p","c":"В зависимости от вида исследования может потребоваться голодание. Соблюдайте указания больницы относительно еды и напитков перед исследованием."},{"h":"Как проводится исследование","t":"ol","c":["Вы принимаете положение на столе по указанию персонала.","По команде проглатываете контрастное вещество.","Прохождение контраста по пищеводу наблюдают в реальном времени.","При необходимости выполняют снимки в нескольких положениях.","По указанию вас могут попросить задержать дыхание или изменить положение."]},{"h":"Во время исследования","t":"p","c":"Проглатывайте контраст по команде медицинского персонала. На некоторых снимках проверяют, не попадает ли контраст в дыхательные пути, поэтому не меняйте положение самостоятельно.","w":1}],[{"h":"Что это за исследование?","t":"p","c":"С помощью контрастного вещества оценивают форму и состояние прямой и толстой кишки. Исследование используется для оценки сужения, непроходимости и структурных изменений толстой кишки."},{"h":"Подготовка","t":"p","c":"Остатки кала могут затруднить исследование, поэтому важна подготовка кишечника. Точно соблюдайте указания больницы по диете, голоданию и приёму слабительных."},{"h":"Как проводится исследование","t":"ol","c":["Вы ложитесь на бок.","В прямую кишку вводят катетер и, при необходимости, контрастное вещество и воздух.","С помощью рентгеноскопии наблюдают заполнение толстой кишки и выполняют снимки в разных положениях.","Продолжительность может увеличиться в зависимости от прохождения контраста."]},{"h":"Во время исследования","t":"p","c":"При введении контраста может появиться позыв к дефекации или вздутие живота. Если дискомфорт сильный, сообщите медицинскому персоналу.","w":1}],[{"h":"Что такое уретрография (RUG)?","t":"p","c":"С помощью контрастного вещества оценивают форму и проходимость мочеиспускательного канала. Исследование может применяться для оценки сужения или повреждения уретры."},{"h":"Как проводится уретрография","t":"ol","c":["Вы ложитесь на стол.","Область исследования обрабатывают, при необходимости в уретру вводят катетер.","Через катетер вводят контраст и наблюдают уретру при рентгеноскопии в разных положениях."]},{"h":"","t":"p","c":"Во время исследования возможны лёгкий дискомфорт или позыв к мочеиспусканию."},{"h":"Что такое цистография?","t":"p","c":"Контрастное вещество вводят в мочевой пузырь, чтобы оценить его форму и наличие изменений."},{"h":"Как проводится цистография","t":"ol","c":["В мочевой пузырь вводят катетер.","Через катетер вводят контраст и наблюдают наполнение мочевого пузыря.","Выполняют необходимые снимки в заданных положениях.","После нужных снимков контраст выводят; при необходимости выполняют дополнительные снимки, затем катетер удаляют."]}],[{"h":"Что такое VCUG?","t":"p","c":"Микционная цистоуретрография (VCUG) позволяет оценить мочевой пузырь и уретру и проверить, не забрасывается ли моча из мочевого пузыря обратно в сторону мочеточников во время мочеиспускания. Особенно часто исследование выполняют у детей для оценки пузырно-мочеточникового рефлюкса (VUR)."},{"h":"Подготовка","t":"p","c":"Обычно голодание не требуется, но это зависит от цели исследования и состояния пациента. Следуйте указаниям больницы."},{"h":"Как проводится исследование","t":"ol","c":["Вы ложитесь на стол.","После обработки кожи через уретру в мочевой пузырь вводят катетер и контрастное вещество.","При наполнении мочевого пузыря, натуживании и мочеиспускании с помощью рентгеноскопии наблюдают и записывают изображения, чтобы проверить рефлюкс.","После снимков пациент мочится в туалете в кабинете рентгеноскопии. При необходимости выполняют снимки после мочеиспускания для оценки остаточной мочи и состояния мочевого пузыря и мочеточников."]},{"h":"Для детей","t":"p","c":"Введение катетера может быть неприятным или вызывать стресс. Родитель или опекун может помочь ребёнку пройти исследование, следуя указаниям медицинского персонала.","w":1}],[{"h":"Что это за исследование?","t":"p","c":"С помощью рентгеноскопии оценивают положение эндопротеза коленного сустава и его состояние при движении колена, выполняя снимки в разных положениях."},{"h":"Подготовка","t":"ul","c":["Вас могут попросить снять металлические предметы и аксессуары в области исследования.","Возможно, потребуется переодеться в одежду для исследования."]},{"h":"Как проводится исследование","t":"ol","c":["Вы принимаете положение на столе по указанию персонала.","По указанию медицинского персонала вы можете менять положение, например сгибать колено или лежать на животе."]}],[{"h":"Что это за исследование?","t":"p","c":"Видеофлюороскопическое исследование глотания (VFSS) позволяет наблюдать процесс глотания с помощью рентгеноскопии и оценивать функцию глотания и наличие аспирации. Оценивается прохождение пищи изо рта через глотку в пищевод."},{"h":"Подготовка","t":"p","c":"В некоторых случаях голодание не требуется, однако это зависит от цели исследования и состояния пациента. Следуйте указаниям больницы относительно питания перед исследованием."},{"h":"Как проводится исследование","t":"ol","c":["Вы принимаете положение перед оборудованием.","Во время проглатывания предоставленных продуктов и напитков рентгеноскопия в реальном времени показывает их прохождение изо рта через глотку в пищевод.","При необходимости для оценки меняют положение тела или способ глотания."]},{"h":"Во время исследования","t":"p","c":"Глотайте в соответствии с указаниями медицинского персонала. Исследование позволяет оценить, происходит ли аспирация — попадание пищи или жидкости в дыхательные пути.","w":1}],[{"h":"Что это за лечение?","t":"p","c":"С помощью рентгеноскопии определяют положение дугоотростчатого сустава позвоночника, после чего вводят препараты, такие как стероид и местный анестетик, чтобы уменьшить боль и воспаление."},{"h":"Подготовка","t":"ul","c":["Следуйте указаниям медицинского персонала.","Сообщите о принимаемых лекарствах, включая антикоагулянты и антиагреганты.","Сообщите, если ранее была реакция на стероиды или местные анестетики.","Если возможна беременность, сообщите об этом до процедуры."]},{"h":"Как проводится лечение","t":"ol","c":["Вы ложитесь на живот или принимаете назначенное положение; кожу обрабатывают.","С помощью рентгеноскопии определяют целевую область; при необходимости небольшое количество контрастного вещества используют для проверки положения иглы.","Вводят лекарство и удаляют иглу."]},{"h":"После лечения","t":"p","c":"В месте инъекции временно могут возникнуть боль или болезненность. Соблюдайте указания медицинского персонала относительно активности и выписки."}]],"mn":[[{"h":"Шинжилгээ гэж юу вэ?","t":"p","c":"Дээд ходоод гэдэсний замын (UGI) тодосгогч шинжилгээгээр улаан хоолойн доод хэсэг, ходоод, 12 хуруу гэдэсний хэлбэр болон хөдөлгөөнийг шалгана. Нарийн гэдэсний шинжилгээгээр тодосгогч бодис нарийн гэдсээр хэрхэн дамжиж байгааг ажиглан бүтэц болон нэвтрэлтийг үнэлнэ."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"ul","c":["Шинжилгээний өмнө өлөн байна.","Тамхи татах болон бохь зажлахаас зайлсхийж, шинжилгээнд нөлөөлөхөөс сэргийлнэ.","Эмээ эмнэлгийн зааврын дагуу хэрэглэнэ."]},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр хэвтэж, зааврын дагуу байрлалаа авна.","Тодосгогч бодис болон шаардлагатай үед хий үүсгэдэг шингэн эмийг ууна.","Тодосгогч бодисын хөдөлгөөнийг бодит цаг хугацаанд ажиглахын зэрэгцээ байрлалаа өөрчилж, шаардлагатай үед хэвлийг дарж зураг авна.","Нарийн гэдэсний шинжилгээнд тодосгогч бодис нарийн гэдсийг бүхэлд нь дамжих хүртэл тодорхой хугацааны зайтай зураг авч болох тул илүү удаан үргэлжилж болно."]},{"h":"Шинжилгээний үед","t":"p","c":"“Хэхрэхгүй байгаарай”, “хажуу тийш эргээрэй” гэх мэт зааврыг дагана уу. Түр зуур гэдэс дүүрч болно.","w":1}],[{"h":"Шинжилгээ гэж юу вэ?","t":"p","c":"Тодосгогч бодис залгих үед улаан хоолойн хэлбэр болон хоол дамжих явцыг ажиглана. Улаан хоолойн нарийсал, дамжих саад болон бүтцийн өөрчлөлтийг үнэлэхэд ашиглана."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"p","c":"Шинжилгээний төрлөөс хамаарч өлөн байх шаардлагатай байж болно. Хоол, ундааны хэрэглээний талаар эмнэлгийн зааврыг дагана уу."},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр зааврын дагуу байрлалаа авна.","Заавар өгөх үед тодосгогч бодисыг залгина.","Тодосгогч бодис улаан хоолойгоор дамжихыг бодит цаг хугацаанд ажиглана.","Шаардлагатай үед хэд хэдэн байрлалаар зураг авна.","Зааврын дагуу амьсгалаа түгжих эсвэл байрлалаа өөрчилж болно."]},{"h":"Шинжилгээний үед","t":"p","c":"Эмнэлгийн ажилтны зааврын дагуу тодосгогч бодисыг залгина. Зарим зурагт тодосгогч бодис амьсгалын замд орж байгаа эсэхийг шалгадаг тул өөрийн дураар хөдөлж болохгүй.","w":1}],[{"h":"Шинжилгээ гэж юу вэ?","t":"p","c":"Тодосгогч бодис ашиглан шулуун гэдэс болон бүдүүн гэдэсний хэлбэр, байдлыг шалгана. Бүдүүн гэдэсний нарийсал, бөглөрөл болон бүтцийн өөрчлөлтийг үнэлэхэд ашиглана."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"p","c":"Гэдсэнд өтгөн үлдсэн бол шинжилгээ хийхэд хүндрэлтэй тул гэдэс цэвэрлэх бэлтгэл чухал. Хоолны дэглэм, өлөн байх хугацаа болон туулгах эмийн талаар эмнэлгийн зааврыг нарийн дагана уу."},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр хажуугаар хэвтэнэ.","Шулуун гэдсэнд катетер хийж, тодосгогч бодис болон шаардлагатай үед агаарыг оруулна.","Тодосгогч бодис бүдүүн гэдсийг дүүргэх явцыг флюороскопиор ажиглаж, янз бүрийн байрлалаар зураг авна.","Тодосгогч бодис дамжих байдлаас шалтгаалан шинжилгээ удаан үргэлжилж болно."]},{"h":"Шинжилгээний үед","t":"p","c":"Тодосгогч бодис оруулах үед бие засмаар санагдах эсвэл гэдэс дүүрэх мэдрэмж төрж болно. Хэрэв зовиур их байвал эмнэлгийн ажилтанд хэлээрэй.","w":1}],[{"h":"Уретрографи (RUG) гэж юу вэ?","t":"p","c":"Тодосгогч бодис ашиглан шээсний сүвний хэлбэр болон нэвтрэлтийг шалгана. Шээсний сүвний нарийсал эсвэл гэмтлийг үнэлэхэд хэрэглэж болно."},{"h":"Уретрографи хэрхэн хийгдэх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр хэвтэнэ.","Шинжилгээний хэсгийг ариутгаж, шаардлагатай үед шээсний сүвэнд катетер хийж болно.","Катетерээр тодосгогч бодис оруулж, шээсний сүвийг янз бүрийн байрлалаар флюороскопиор ажиглана."]},{"h":"","t":"p","c":"Шинжилгээний үед бага зэрэг зовиурлах эсвэл шээмээр санагдаж болно."},{"h":"Цистографи гэж юу вэ?","t":"p","c":"Давсагт тодосгогч бодис оруулж, давсагны хэлбэр болон өөрчлөлтийг шалгана."},{"h":"Цистографи хэрхэн хийгдэх вэ?","t":"ol","c":["Давсагт катетер хийнэ.","Катетерээр тодосгогч бодис оруулж, давсаг дүүрэх явцыг ажиглана.","Шаардлагатай байрлалаар зураг авна.","Шаардлагатай зураг авсны дараа тодосгогч бодисыг гадагшлуулж, шаардлагатай бол нэмэлт зураг аваад катетерийг авна."]}],[{"h":"VCUG гэж юу вэ?","t":"p","c":"VCUG нь давсаг болон шээсний сүвийг шалгаж, шээх үед шээс давсагнаас шээлгүүрийн зүг буцаж урсаж байгаа эсэхийг үнэлнэ. Ялангуяа хүүхдийн давсаг-шээлгүүрийн сөргөө (VUR)-г үнэлэхэд өргөн хэрэглэнэ."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"p","c":"Ихэнх тохиолдолд өлөн байх шаардлагагүй боловч шинжилгээний зорилго болон өвчтөний байдлаас хамаарч өөр байж болно. Эмнэлгийн зааврыг дагана уу."},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр хэвтэнэ.","Ариутгасны дараа шээсний сүвээр катетерийг давсагт оруулж, тодосгогч бодис хийнэ.","Давсаг дүүрэх үед болон хүчлэх эсвэл шээх үед флюороскопиор ажиглаж, сөргөө байгаа эсэхийг шалгана.","Зураг авсны дараа флюороскопийн өрөөний ариун цэврийн өрөөнд шээж, шаардлагатай бол шээсний дараах зураг авч үлдэгдэл шээс болон давсаг, шээлгүүрийн байдлыг шалгана."]},{"h":"Хүүхдийн хувьд","t":"p","c":"Катетер хийх нь зовиуртай эсвэл айдас төрүүлж болно. Асран хамгаалагч нь эмнэлгийн ажилтны зааврыг дагаж хүүхдийг шинжилгээнд хамтран ажиллахад нь тусална.","w":1}],[{"h":"Шинжилгээ гэж юу вэ?","t":"p","c":"Флюороскопи ашиглан өвдөгний хиймэл үений байрлал болон өвдгийг хөдөлгөх үеийн байдлыг янз бүрийн байрлалаар зураг авч үнэлнэ."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"ul","c":["Шинжилгээний хэсгийн ойролцоох металл зүйл болон гоёл чимэглэлийг тайлах шаардлагатай байж болно.","Шинжилгээний хувцас өмсөх шаардлагатай байж болно."]},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Шинжилгээний ширээн дээр зааврын дагуу байрлалаа авна.","Эмнэлгийн ажилтны зааврын дагуу өвдгөө нугалах, түрүүлгээ харж хэвтэх зэрэг байрлалаа өөрчилж зураг авна."]}],[{"h":"Шинжилгээ гэж юу вэ?","t":"p","c":"Видео флюороскопийн залгилтын шинжилгээ (VFSS) нь хоол залгих үйл явцыг рентген флюороскопиор ажиглаж, залгилтын үйл ажиллагаа болон амьсгалын замд хоол, шингэн орж байгаа эсэхийг үнэлнэ. Хоол амнаас залгиур, улмаар улаан хоолой руу дамжих явцыг шалгана."},{"h":"Шинжилгээний өмнөх бэлтгэл","t":"p","c":"Зарим тохиолдолд өлөн байх шаардлагагүй боловч шинжилгээний зорилго болон өвчтөний байдлаас хамаарна. Шинжилгээний өмнө хооллох эсэх талаар эмнэлгийн зааврыг дагана уу."},{"h":"Шинжилгээг хэрхэн хийх вэ?","t":"ol","c":["Тоног төхөөрөмжийн өмнө зөв байрлалаа авна.","Өгсөн хоол, ундааг залгих үед амнаас залгиур, улаан хоолой руу дамжих явцыг бодит цаг хугацаанд зураглана.","Шаардлагатай бол байрлал эсвэл залгих аргыг өөрчилж үнэлнэ."]},{"h":"Шинжилгээний үед","t":"p","c":"Эмнэлгийн ажилтны зааврын дагуу хоолоо залгина. Хоол, шингэн амьсгалын замд орж байгаа эсэх буюу аспирацийг үнэлэх боломжтой.","w":1}],[{"h":"Энэ ямар эмчилгээ вэ?","t":"p","c":"Флюороскопи ашиглан нурууны facet үеийн байрлалыг тодорхойлсны дараа стероид болон хэсгийн мэдээ алдуулагч зэрэг эмийг тарьж өвдөлт, үрэвслийг багасгана."},{"h":"Эмчилгээний өмнөх бэлтгэл","t":"ul","c":["Эмнэлгийн ажилтны өгсөн зааврыг дагана уу.","Цус шингэлэгч болон ялтасны эсрэг эм зэрэг хэрэглэж байгаа бүх эмийнхээ талаар хэлнэ үү.","Стероид эсвэл хэсгийн мэдээ алдуулагчид өмнө нь урвал өгч байсан бол мэдэгдэнэ үү.","Жирэмсэн байх боломжтой бол эмчилгээний өмнө мэдэгдэнэ үү."]},{"h":"Эмчилгээг хэрхэн хийх вэ?","t":"ol","c":["Ширээн дээр түрүүлгээ харж эсвэл заасан байрлалаар хэвтэж, арьсыг ариутгана.","Флюороскопиор зорилтот хэсгийг тодорхойлж, шаардлагатай бол бага хэмжээний тодосгогч бодис ашиглан зүүний байрлалыг шалгана.","Эмийг тарьж, зүүг авна."]},{"h":"Эмчилгээний дараа","t":"p","c":"Тарилгын хэсэг түр хугацаанд өвдөх эсвэл хөндүүрлэж болно. Хөдөлгөөн болон эмнэлгээс гарах талаар эмнэлгийн ажилтны зааврыг дагана уу."}]]};

mn:["‹ Буцах","Флюороскопийн шинжилгээний заавар","Сонирхсон хэсгээ дарж үзнэ үү.","7 дугаар өрөөнд хэрхэн очих вэ","Түгээмэл асуултууд","Шинжилгээний төрөл, бэлтгэл","8 төрлийн шинжилгээ","Шинжилгээгээ сонгож дэлгэрэнгүйг үзнэ үү.","Байршил ба холбоо барих","Цаг захиалга, бэлтгэлийн талаар доорх хаягаар холбогдоно уу.","Бүртгэл","Үндсэн байр 3-р давхар, Дүрс оношилгооны бүртгэл","Утас","Ажлын цаг","Даваа–Баасан 08:30 ~ 17:30","Байршил","Үндсэн байр 2-р давхар, 7 дугаар флюороскопийн өрөө","Зургийн дарааллаар явна уу.","1. Дүрс оношилгооны бүртгэл","2. Үндсэн байр 2-р давхар","3. 7 дугаар флюороскопийн өрөө","","Энэ нь ерөнхий мэдээлэл юм. Эмчийн зөвлөгөөг эхэлж дагана уу.","Холбоо барих"]};

pre:{t:"Before Your Exam",d:"Fasting, pregnancy, medications, contrast history",s:[S("","p","Preparation differs by exam, so please check the instructions you received when booking."),S("Fasting","p","Some exams require fasting, especially exams of the stomach, esophagus, or small bowel. The fasting time depends on the exam and your condition, so follow the hospital's instructions."),S("If you may be pregnant","p","Tell the medical staff before the exam if you are or may be pregnant. Because X-rays are used, the exam method can be adjusted if needed."),S("Medications you take","ul",["Anticoagulants (blood thinners)","Antiplatelet drugs","Diabetes medication","Insulin","Other prescription drugs"]),S("","p","If you take these, the medical staff may need to check before your exam or procedure. Do not stop any medication on your own."),S("Past reactions to contrast medium","ul",["Hives","Itching","Difficulty breathing","Swelling of the face or lips","Severe vomiting","Other reactions"],0),S("","p","Tell us before the exam if you have ever had any of these.")]},

ru:{intro:{t:"Что такое рентгеноскопия?",d:"Рентген-наблюдение в реальном времени",s:[S("Рентгеноскопия (Fluoroscopy)","p","Исследование с помощью рентгеновских лучей, позволяющее в реальном времени наблюдать строение и движение внутри тела."),S("Чем отличается от обычного рентгена","p","Обычный рентген — это один снимок момента. При рентгеноскопии изображение непрерывно, и можно видеть движение органов и контрастного вещества. В зависимости от исследования контраст пьют, вводят через трубку или напрямую в нужную область."),S("Что можно увидеть","ul",["Форма и движение желудка, кишечника, толстой кишки","Прохождение пищи по пищеводу и глотание","Строение мочевого пузыря и уретры, движение и рефлюкс мочи","Путь контрастного вещества и его утечка","Точное положение иглы при инъекциях в позвоночник и суставы","Положение эндопротеза (TKRA) и других конструкций"])]},
pre:{t:"Перед исследованием",d:"Голод, беременность, лекарства, реакции на контраст",s:[S("","p","Подготовка зависит от вида исследования. Проверьте инструкции, полученные при записи."),S("Голод","p","Для некоторых исследований нужно воздержаться от еды, особенно для желудка, пищевода и тонкой кишки. Время зависит от исследования и вашего состояния — следуйте указаниям больницы."),S("Если возможна беременность","p","Обязательно сообщите медперсоналу, если вы беременны или возможна беременность. Метод исследования при необходимости корректируется."),S("Принимаемые лекарства","ul",["Антикоагулянты","Антиагреганты","Препараты от диабета","Инсулин","Другие рецептурные препараты"]),S("","p","Врачу может потребоваться проверить это до исследования или процедуры. Не отменяйте лекарства самостоятельно."),S("Прошлые реакции на контраст","ul",["Крапивница","Зуд","Затруднённое дыхание","Отёк лица или губ","Сильная рвота","Другие реакции"],0),S("","p","Если что-либо из этого было ранее, обязательно сообщите до исследования.")]}},
mn:{intro:{t:"Флюороскопи гэж юу вэ?",d:"Рентгенээр бодит цагт харах шинжилгээ",s:[S("Флюороскопи","p","Рентген туяагаар биеийн доторх бүтэц, хөдөлгөөнийг бодит цагт харах дүрс оношилгоо юм."),S("Энгийн рентгенээс ялгаа","p","Энгийн рентген нэг агшныг нэг зургаар харуулдаг бол флюороскопи рентген дүрсийг тасралтгүй харж, эрхтэн болон тодосгогчийн хөдөлгөөнийг бодит цагт харуулна. Шинжилгээний зорилгоос хамаарч тодосгогчийг ууна, хоолойгоор оруулна эсвэл тодорхой хэсэгт шууд тарина."),S("Юуг харж болох вэ","ul",["Ходоод, гэдэс, бүдүүн гэдэсний хэлбэр, хөдөлгөөн","Улаан хоолойгоор хоол дамжих, залгих чадвар","Давсаг, шээсний сүвийн бүтэц, шээсний урвуу гүйдэл","Тодосгогчийн явах зам, алдагдал","Нугас, үений тарилгын үеийн нарийн байршил","Хиймэл үе (TKRA) болон бусад бүтцийн байршил"])]},
pre:{t:"Шинжилгээний өмнөх анхааруулга",d:"Мацаг, жирэмслэлт, эм, тодосгогчийн түүх",s:[S("","p","Шинжилгээний төрлөөс хамаарч бэлтгэл өөр тул цаг авахдаа өгсөн зааврыг заавал шалгана уу."),S("Мацаг барих","p","Зарим шинжилгээнд мацаг барих шаардлагатай. Ялангуяа ходоод, улаан хоолой, нарийн гэдэсний шинжилгээнд хэрэгтэй байж болно. Хугацаа нь шинжилгээ, таны биеийн байдлаас хамаарах тул эмнэлгийн зааврыг дагана уу."),S("Жирэмсэн байж болзошгүй бол","p","Жирэмсэн эсвэл жирэмсэн байж болзошгүй бол шинжилгээнээс өмнө эмнэлгийн ажилтанд заавал хэлнэ үү. Шаардлагатай бол шинжилгээний аргыг өөрчилнө."),S("Уудаг эм","ul",["Цус шингэлэх эм","Тромбоцитийн эсрэг эм","Чихрийн шижингийн эм","Инсулин","Бусад жороор олгосон эм"]),S("","p","Эмч шинжилгээ, мэс ажилбарын өмнө шалгах шаардлагатай байж болно. Эмээ өөрөө бүү зогсоо."),S("Тодосгогчид өмнө гарсан урвал","ul",["Тууралт","Загатнах","Амьсгаадах","Нүүр, уруулын хаван","Хүчтэй бөөлжих","Бусад урвал"],0),S("","p","Өмнө нь ийм урвал гарч байсан бол шинжилгээнээс өмнө заавал хэлнэ үү.")]}}};
TR.en.faq={t:"FAQ",d:"Pain, radiation, pregnancy, eating, and more",s:[S("","faq",[
["Is fluoroscopy painful?","Inserting a thin catheter or injecting contrast media may cause mild discomfort, but severe pain is rare. Some exams, such as upper GI or esophagram, involve drinking contrast rather than catheter insertion or injection."],
["Why do I need to change positions during the exam?","To see the inside of the organs and the flow of contrast accurately from different angles."],
["Do I have to hold my breath?","If needed, the medical staff will say \"Hold your breath.\" Please hold it briefly as instructed."],
["Is fasting required?","Fasting is required only for certain exams, such as some exams involving contrast medium. Follow the fasting instructions you received when booking."],
["Can I eat right after the exam?","It depends on the exam and whether a procedure was done. After a simple contrast exam you can often eat, but if a procedure was also done, you need separate instructions from the medical staff."],
["I already had a regular X-ray. Why do I need a knee replacement (TKRA) fluoroscopy exam too?","A regular X-ray checks the alignment and overall structure of the leg. The TKRA fluoroscopy exam uses images taken in different positions to assess the position of the implant and its condition while the knee is moved."],
["Does the contrast medium stay in my body?","It is eliminated, depending on the type. Barium leaves mainly in the stool. Water-soluble iodine contrast leaves mostly through the kidneys in the urine. Unless you have a fluid restriction, drinking plenty of fluids after the exam can help."],
["Can I have fluoroscopy during pregnancy?","If you are or may be pregnant, please tell the medical staff before the exam. We consider the need for the exam and the body area, and choose a method that minimizes radiation exposure."],
["Will I be exposed to a lot of radiation?","Continuous real-time imaging uses more radiation than a single X-ray, but we apply radiation protection techniques and use the lowest dose needed for diagnosis."],
["What if I feel uncomfortable during the exam?","Tell the medical staff right away; do not hold back. Severe pain, difficulty breathing, dizziness, or allergic symptoms must be reported immediately."]])]};
TR.ru.faq={t:"Частые вопросы",d:"Боль, облучение, беременность, питание",s:[S("","faq",[
["Больно ли делать рентгеноскопию?","Введение тонкого катетера или контрастного вещества может вызвать лёгкий дискомфорт, но сильная боль встречается редко. При некоторых исследованиях, например верхних отделов ЖКТ или пищевода, контраст принимают внутрь."],
["Зачем во время исследования нужно поворачиваться?","Чтобы точно увидеть внутреннее строение органов и движение контрастного вещества с разных сторон."],
["Нужно ли задерживать дыхание?","При необходимости медперсонал скажет «Задержите дыхание». Ненадолго задержите дыхание по команде."],
["Нужно ли голодать перед исследованием?","Голодание требуется только при некоторых исследованиях, например при отдельных исследованиях с контрастным веществом. Следуйте указаниям больницы, полученным при записи."],
["Можно ли есть сразу после исследования?","Зависит от исследования и от того, проводилась ли процедура. После простого контрастного исследования часто можно есть, но если проводилась и процедура, потребуются отдельные указания медперсонала."],
["Мне уже делали обычный рентген. Зачем ещё рентгеноскопия после эндопротезирования колена (TKRA)?","Обычный рентген показывает ось и общее строение ноги. При рентгеноскопии TKRA выполняют снимки в разных положениях, чтобы оценить положение эндопротеза и его состояние при движении колена."],
["Остаётся ли контрастное вещество в организме?","Оно выводится, в зависимости от вида. Барий выводится в основном с калом, водорастворимый йодсодержащий контраст — в основном почками с мочой. Если нет ограничений по жидкости, после исследования полезно пить больше воды."],
["Можно ли делать рентгеноскопию при беременности?","Если вы беременны или это возможно, обязательно сообщите медперсоналу до исследования. С учётом необходимости исследования и области тела выбирается метод с минимальной дозой облучения."],
["Большая ли лучевая нагрузка?","Непрерывная съёмка в реальном времени даёт большую дозу, чем один снимок, но применяются методы защиты, и исследование проводится с минимальной дозой, необходимой для диагностики."],
["Что делать, если во время исследования неудобно?","Не терпите, сразу скажите медперсоналу. О сильной боли, затруднённом дыхании, головокружении и аллергических симптомах сообщайте немедленно."]])]};
TR.mn.faq={t:"Түгээмэл асуултууд",d:"Өвдөлт, туяа, жирэмслэлт, хооллолт",s:[S("","faq",[
["Флюороскопи өвддөг үү?","Нимгэн катетер оруулах эсвэл тодосгогч бодис тарих үед бага зэрэг таагүй мэдрэмж төрж болох ч хүчтэй өвдөлт ховор. Дээд ходоод гэдэс, улаан хоолойн зарим шинжилгээнд тодосгогчийг ууж хэрэглэдэг."],
["Шинжилгээний үеэр яагаад биеэ эргүүлдэг вэ?","Эрхтний дотор бүтэц болон тодосгогч бодисын хөдөлгөөнийг өөр өөр өнцгөөс нарийвчлан харахын тулд юм."],
["Амьсгаагаа түгжих хэрэгтэй юу?","Шаардлагатай үед эмнэлгийн ажилтан «Амьсгаагаа түгжээрэй» гэж хэлнэ. Зааврын дагуу түр зуур түгжихэд болно."],
["Шинжилгээний өмнө ус уувал болох уу?","Шинжилгээний төрлөөс хамаарна. Дээд ходоод гэдэс, нарийн гэдэс, улаан хоолойн шинжилгээнд мацаг барих шаардлагатай байж болох тул цаг авахдаа өгсөн зааврыг дагана уу."],
["Шинжилгээний дараа шууд хоол идэж болох уу?","Шинжилгээний төрөл, мэс ажилбар хийсэн эсэхээс хамаарна. Энгийн тодосгогч шинжилгээний дараа идэж болох тохиолдол бий, харин мэс ажилбар хамт хийсэн бол эмнэлгийн ажилтны тусгай зааварчилгаа шаардлагатай."],
["Энгийн рентген авсан атал өвдөгний үений протезийн (TKRA) флюороскопи яагаад дахин хийдэг вэ?","Энгийн рентген хөлийн бүхэл хэлбэр, ерөнхий бүтцийг харуулдаг. TKRA флюороскопи нь өнцгийг нарийн тохируулж, имплантын холболтын яг өнцөг, хөдлөх үеийн нарийн байдлыг бодит цагт шалгадаг."],
["Тодосгогч биед үлддэг үү?","Төрлөөсөө хамаарч биеэс гарна. Бари нь голдуу баасаар, усанд уусдаг иодтой тодосгогч нь ихэвчлэн бөөрөөр дамжин шээсээр гарна. Шингэн хязгаарлаагүй бол шинжилгээний дараа их ус уух нь тустай."],
["Жирэмсэн үед флюороскопи хийлгэж болох уу?","Жирэмсэн эсвэл жирэмсэн байж болзошгүй бол шинжилгээнээс өмнө заавал хэлнэ үү. Шинжилгээний шаардлага, биеийн хэсгийг харгалзан туяанд өртөх хэмжээг багасгах аргыг сонгоно."],
["Флюороскопи туяанд их өртдөг үү?","Бодит цагийн тасралтгүй зураг авдаг тул нэг рентгенээс илүү туяа өгдөг ч хамгаалалтын аргыг хэрэглэж, оношид шаардлагатай хамгийн бага тунгаар хийнэ."],
["Шинжилгээний үеэр эвгүй санагдвал яах вэ?","Тэвчихгүй шууд эмнэлгийн ажилтанд хэлээрэй. Хүчтэй өвдөлт, амьсгаадах, толгой эргэх, харшлын шинж илэрвэл даруй мэдэгдэх хэрэгтэй."]])]};
TR.ru.post={t:"После исследования",d:"Меры предосторожности и тревожные симптомы",s:[S("Бариевый контраст (верхние отделы ЖКТ, тонкая кишка, некоторые исследования толстой кишки)","ul",["Барий может вызвать запор, поэтому пейте достаточно воды, если нет ограничений.","В течение 1–2 дней стул может быть белым или светлым — это нормально."]),S("Водорастворимый йодсодержащий контраст","ul",["Если нет ограничений, пейте достаточно жидкости.","Возможны кратковременные тошнота, головная боль, головокружение, зуд.","При крапивнице, отёке лица или шеи, затруднённом дыхании, сильном головокружении немедленно сообщите медперсоналу.","Если симптомы сохраняются или усиливаются, обратитесь в медицинское учреждение."]),S("После процедуры","ul",["Возможны боль или скованность в месте инъекции.","При сильной боли, кровотечении или повышении температуры сообщите медперсоналу."]),S("Сообщите медперсоналу, если появились","ul",["Сильная боль в животе","Непрекращающаяся рвота","Сильное вздутие живота","Сильное кровотечение","Затруднённое дыхание","Сильное головокружение","Выраженные аллергические симптомы","Боль, которая сохраняется или усиливается"],1)]};
TR.mn.post={t:"Шинжилгээний дараах анхааруулга",d:"Анхаарах зүйл, аюулын шинж",s:[S("Бари тодосгогч (дээд ходоод гэдэс, нарийн гэдэс, зарим бүдүүн гэдэсний шинжилгээ)","ul",["Бари нь өтгөн хатаж болох тул хязгаарлалтгүй бол ус хангалттай уугаарай.","1–2 өдөр баасны өнгө цагаан эсвэл цайвар байж болох ба энэ нь хэвийн."]),S("Усанд уусдаг иодтой тодосгогч","ul",["Хязгаарлалтгүй бол шингэн хангалттай уугаарай.","Дотор муухайрах, толгой өвдөх, толгой эргэх, загатнах шинж түр зуур илэрч болно.","Тууралт, нүүр, хүзүүний хаван, амьсгаадах, хүчтэй толгой эргэх шинж илэрвэл даруй эмнэлгийн ажилтанд хэлнэ үү.","Шинж тэмдэг үргэлжилж эсвэл хүндэрвэл эмнэлэгт хандаарай."]),S("Мэс ажилбар хийлгэсэн бол","ul",["Тарилга хийсэн хэсэг өвдөх, чангарч болно.","Хүчтэй өвдөлт, цус алдалт, халуурвал эмнэлгийн ажилтанд хэлнэ үү."]),S("Дараах шинж илэрвэл эмнэлгийн ажилтанд хэлнэ үү","ul",["Хүчтэй гэдэс өвдөх","Тасралтгүй бөөлжих","Гэдэс хүчтэй хөөрөх","Их хэмжээний цус алдалт","Амьсгаадах","Хүчтэй толгой эргэх","Хүчтэй харшлын шинж","Үргэлжилсэн эсвэл улам нэмэгдсэн өвдөлт"],1)]};

const app=document.getElementById("app"),back=document.getElementById("back"),cb=document.getElementById("cb"),sel=document.getElementById("lang");
sel.innerHTML=Object.keys(LN).map(k=>`<option value="${k}">${LN[k]}</option>`).join("");
const E=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const card=(h,i,t,d,w,b)=>`<a class="card${w?" wide":""}${b=="g"?" glass":b!=null?" bg":""}" href="${h}" style="text-decoration:none${b!=null&&b!="g"?`;background-image:url(${IMG[b]})`:""}"><div><h3>${t}</h3><p>${d}</p></div></a>`;
const sec=x=>`<section class="sec${x.w?" warn":""}">${x.h?`<h2>${x.h}</h2>`:""}${x.t=="p"?`<p>${E(x.c)}</p>`:x.t=="faq"?x.c.map(q=>`<details><summary>${E(q[0])}</summary><p>${E(q[1])}</p></details>`).join(""):`<${x.t}>${x.c.map(l=>`<li>${E(l)}</li>`).join("")}</${x.t}>`}</section>`;
const page=(h,s,sub,note)=>`<h1>${h}</h1>${sub?`<p class="lead">${sub}</p>`:""}${note?`<p class="note">${note}</p>`:""}${s.map(sec).join("")}`;
function contact(){return `<section id="contact" class="ct"><div><h2>${t("ct")}</h2><p class="lead2">${t("cs")}</p><dl><div><dt>${t("reg")}</dt><dd>${t("regv")}</dd></div><div><dt>${t("tel")}</dt><dd><a href="tel:0222909172">02-2290-9172</a></dd></div><div><dt>${t("hours")}</dt><dd>${t("hv")}</dd></div><div><dt>${t("loc")}</dt><dd><a href="#/way">${t("locv")}</a></dd></div></dl></div><a href="#/way" class="ctimg"><img src="${IMG[12]}" alt="${t("locv")}"></a></section>`}
function route(){const h=location.hash.slice(1)||"/",p=h.split("/");let o="",b="#/";
if(h=="/"){const q=k=>card("#/p/"+k,"",pg(k).t,pg(k).d,0,"g");o=`<h1>${t("title")}</h1><p class="lead">${t("lead")}</p><div class="quick"><a class="pill" href="#/way">${t("way")}</a><a class="pill" href="#/p/faq">${t("faq")}</a></div><div class="hero">${card("#/p/intro","",pg("intro").t,pg("intro").d,1,"g")}<div class="grid">${q("pre")}${card("#/tests","",t("tests"),t("testsd"),0,"g")}${q("post")}${q("faq")}</div></div>${contact()}`}
else if(p[1]=="p"&&P[p[2]]){const x=pg(p[2]);o=page(x.t,x.s,"",x.ok?"":t("note"))}
else if(p[1]=="way"){o=`<h1>${t("way")}</h1><p class="lead">${t("wayl")}</p>${[["w1",10],["w2",11],["w3",12]].map(x=>`<figure class="fig"><img src="${IMG[x[1]]}" alt="${t(x[0])}"><figcaption>${t(x[0])}</figcaption></figure>`).join("")}`}
else if(p[1]=="tests"){o=`<h1>${t("tests")}</h1><p class="lead">${t("testsl")}</p><div class="grid">${T.map((x,i)=>card("#/t/"+i,"",tn(i)[0],tn(i)[1],0,i+2)).join("")}</div>`}
else if(p[1]=="t"&&T[p[2]]){const x=T[p[2]],i=+p[2],details=lang=="ko"?x.s:(EXTR[lang]&&EXTR[lang][i])||x.s;b="#/tests";o=page(tn(i)[0],details,tn(i)[1],"")}
if(p[1]=="p")b="#/";
back.textContent=t("back");cb.textContent=t("contact");sel.value=lang;document.documentElement.lang=lang;
back.style.display=h=="/"?"none":"inline-block";back.onclick=()=>location.hash=b;
app.innerHTML=o+`<p class="foot">${t("foot")}</p>`;
document.body.classList.toggle("home",h=="/");fit();scrollTo(0,0)}
function fit(){const hr=document.querySelector(".hero");if(!hr)return;const W=hr.offsetWidth,H=hr.offsetHeight,iw=392,ih=522,s=Math.max(W/iw,H/ih),ox=(W-iw*s)/2,oy=(H-ih*s)/2;hr.querySelectorAll(".card").forEach(c=>{c.style.backgroundImage=`url(${IMG[0]})`;c.style.backgroundSize=`${iw*s}px ${ih*s}px`;c.style.backgroundPosition=`${ox-c.offsetLeft}px ${oy-c.offsetTop}px`})}
const goC=()=>{const e=document.getElementById("contact");if(e)e.scrollIntoView({behavior:"smooth"})};
cb.onclick=()=>{if((location.hash||"#/")!="#/"){location.hash="#/";setTimeout(goC,80)}else goC()};
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem("lg",lang)}catch(e){}route()};
addEventListener("resize",fit);addEventListener("hashchange",route);route();
</script></body></html>
